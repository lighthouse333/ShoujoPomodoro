<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四则运算计算器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .calculator {
            background: #fff;
            border-radius: 20px;
            padding: 40px 35px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 380px;
            text-align: center;
        }

        .calculator h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .input-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .input-group input[type="number"] {
            width: 110px;
            height: 50px;
            font-size: 22px;
            text-align: center;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .input-group input[type="number"]:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .input-group select {
            width: 60px;
            height: 50px;
            font-size: 22px;
            text-align: center;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            outline: none;
            cursor: pointer;
            background: #f8f9ff;
            transition: border-color 0.3s, box-shadow 0.3s;
            appearance: none;
            -webkit-appearance: none;
        }

        .input-group select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .result-box {
            background: #f8f9ff;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
            min-height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
        }

        .result-box .expression {
            font-size: 18px;
            color: #888;
        }

        .result-box .result {
            font-size: 28px;
            font-weight: 700;
            color: #333;
        }

        .hint {
            font-size: 13px;
            color: #aaa;
            margin-top: 15px;
        }

        .hint kbd {
            background: #eee;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 2px 7px;
            font-size: 12px;
            font-family: inherit;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <h1>🧮 四则运算计算器</h1>

        <div class="input-group">
            <input type="number" id="num1" placeholder="数字1" step="any" autofocus>
            <select id="operator">
                <option value="+">+</option>
                <option value="-">−</option>
                <option value="*">×</option>
                <option value="/">÷</option>
            </select>
            <input type="number" id="num2" placeholder="数字2" step="any">
        </div>

        <div class="result-box">
            <span id="display" class="expression">等待输入…</span>
        </div>

        <div class="hint">
            按 <kbd>Enter</kbd> 计算结果
        </div>
    </div>

    <script>
        const num1Input = document.getElementById('num1');
        const num2Input = document.getElementById('num2');
        const operatorSelect = document.getElementById('operator');
        const display = document.getElementById('display');

        function calculate() {
            const num1 = parseFloat(num1Input.value);
            const num2 = parseFloat(num2Input.value);
            const op = operatorSelect.value;

            if (isNaN(num1) || isNaN(num2)) {
                display.className = 'expression';
                display.textContent = '请输入两个有效的数字';
                return;
            }

            let result;
            const opSymbol = operatorSelect.options[operatorSelect.selectedIndex].text;

            switch (op) {
                case '+':
                    result = num1 + num2;
                    break;
                case '-':
                    result = num1 - num2;
                    break;
                case '*':
                    result = num1 * num2;
                    break;
                case '/':
                    if (num2 === 0) {
                        display.className = 'expression';
                        display.textContent = '❌ 除数不能为零';
                        return;
                    }
                    result = num1 / num2;
                    break;
                default:
                    return;
            }

            // 避免浮点数精度问题
            result = parseFloat(result.toFixed(10));

            display.className = 'result';
            display.innerHTML = `${num1} ${opSymbol} ${num2} = <strong style="color:#667eea">${result}</strong>`;
        }

        // 回车键触发计算
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                calculate();
            }
        });

        // 输入框获得焦点时全选
        num1Input.addEventListener('focus', function () {
            this.select();
        });
        num2Input.addEventListener('focus', function () {
            this.select();
        });
    </script>
</body>
</html>
