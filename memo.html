<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本地备忘录</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Segoe UI','Microsoft YaHei',sans-serif;
  display:flex; height:100vh; overflow:hidden;
  background:#f0f2f5;
}

/* ── 侧边栏 ── */
.sidebar {
  width:280px; min-width:200px; background:#1e1e2f; color:#c0c0d0;
  display:flex; flex-direction:column; user-select:none;
}
.sidebar-header {
  padding:18px 16px; display:flex; align-items:center; gap:10px;
  border-bottom:1px solid #2a2a3d;
}
.sidebar-header h2 { flex:1; font-size:16px; font-weight:600; color:#e8e8f0; }
.btn { padding:6px 14px; border:none; border-radius:6px; cursor:pointer;
  font-size:13px; font-weight:500; transition:all .15s; }
.btn-primary { background:#5b6cf0; color:#fff; }
.btn-primary:hover { background:#4a5cd8; }
.btn-sm { padding:3px 8px; font-size:11px; }
.btn-danger { background:#e05555; color:#fff; }
.btn-danger:hover { background:#c94444; }
.btn-outline { background:transparent; border:1px solid #444; color:#c0c0d0; }
.btn-outline:hover { background:#2a2a3d; }

.tree { flex:1; overflow-y:auto; padding:8px 0; }
.tree-item { position:relative; }
.tree-row {
  display:flex; align-items:center; padding:6px 12px; cursor:pointer;
  gap:4px; transition:background .1s; font-size:14px;
}
.tree-row:hover { background:#2a2a3d; }
.tree-row.active { background:#3a3a55; color:#fff; }
.tree-row .arrow {
  width:18px; font-size:10px; text-align:center; flex-shrink:0;
  transition:transform .15s; color:#888;
}
.tree-row .arrow.expanded { transform:rotate(90deg); }
.tree-row .icon { font-size:14px; flex-shrink:0; }
.tree-row .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tree-row .badge { font-size:11px; color:#888; margin-left:auto; flex-shrink:0; }
.tree-row .actions { display:none; gap:2px; flex-shrink:0; }
.tree-row:hover .actions { display:flex; }
.tree-row .actions button {
  background:none; border:none; color:#aaa; cursor:pointer; font-size:12px;
  padding:2px 4px; border-radius:3px;
}
.tree-row .actions button:hover { background:#444; color:#fff; }
.children { display:none; }
.children.open { display:block; }

/* 右键菜单 */
.ctx-menu {
  position:fixed; background:#2a2a3d; border:1px solid #444; border-radius:8px;
  padding:4px 0; min-width:140px; z-index:999; box-shadow:0 8px 24px rgba(0,0,0,.4);
  display:none;
}
.ctx-menu .ctx-item {
  padding:8px 16px; cursor:pointer; font-size:13px; color:#d0d0e0;
}
.ctx-menu .ctx-item:hover { background:#3a3a55; }

/* ── 主内容区 ── */
.main {
  flex:1; display:flex; flex-direction:column; min-width:0;
}
.main-header {
  padding:14px 20px; background:#fff; border-bottom:1px solid #e0e0e0;
  display:flex; align-items:center; gap:12px;
}
.main-header h3 { font-size:15px; color:#333; flex:1; }
.main-header .breadcrumb { font-size:13px; color:#999; }

.toolbar { padding:10px 20px; background:#fff; border-bottom:1px solid #eee;
  display:flex; gap:8px; }

.memo-list { flex:1; overflow-y:auto; padding:10px 20px; }
.memo-item {
  display:flex; align-items:center; gap:10px; padding:10px 12px;
  background:#fff; border-radius:8px; margin-bottom:6px; transition:box-shadow .15s;
}
.memo-item:hover { box-shadow:0 2px 8px rgba(0,0,0,.08); }
.memo-item input[type="checkbox"] {
  width:18px; height:18px; cursor:pointer; accent-color:#5b6cf0; flex-shrink:0;
}
.memo-item .memo-text {
  flex:1; border:none; outline:none; font-size:14px; padding:4px 0;
  background:transparent; color:#333;
}
.memo-item .memo-text.done { text-decoration:line-through; color:#aaa; }
.memo-item .memo-time { font-size:11px; color:#bbb; white-space:nowrap; flex-shrink:0; }
.memo-item .memo-del {
  background:none; border:none; color:#ccc; cursor:pointer; font-size:16px;
  padding:2px 6px; border-radius:4px; flex-shrink:0; display:none;
}
.memo-item:hover .memo-del { display:block; }
.memo-item .memo-del:hover { background:#fee; color:#e55; }

.empty-state {
  text-align:center; color:#bbb; padding:60px 20px;
}
.empty-state .empty-icon { font-size:48px; margin-bottom:12px; }

/* 编辑弹窗 */
.modal-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:1000;
  display:flex; align-items:center; justify-content:center;
}
.modal {
  background:#fff; border-radius:12px; padding:24px; width:360px;
  box-shadow:0 16px 48px rgba(0,0,0,.2);
}
.modal h4 { margin-bottom:16px; color:#333; }
.modal input { width:100%; padding:10px 12px; border:2px solid #e0e0e0;
  border-radius:8px; font-size:14px; outline:none; }
.modal input:focus { border-color:#5b6cf0; }
.modal .btns { margin-top:16px; display:flex; gap:8px; justify-content:flex-end; }
</style>
</head>
<body>

<!-- 右键菜单 -->
<div class="ctx-menu" id="ctxMenu">
  <div class="ctx-item" data-action="newFolder">📁 新建子目录</div>
  <div class="ctx-item" data-action="rename">✏️ 重命名</div>
  <div class="ctx-item" data-action="delete" style="color:#e55">🗑 删除</div>
</div>

<!-- 侧边栏 -->
<div class="sidebar">
  <div class="sidebar-header">
    <h2>📋 我的备忘录</h2>
    <button class="btn btn-primary" onclick="addRootFolder()" title="新建根目录">+ 目录</button>
  </div>
  <div class="tree" id="tree"></div>
</div>

<!-- 主内容区 -->
<div class="main">
  <div class="main-header">
    <h3 id="currentTitle">选择一个目录</h3>
    <span class="breadcrumb" id="breadcrumb"></span>
  </div>
  <div class="toolbar">
    <button class="btn btn-primary" id="btnNewMemo" onclick="addMemo()">+ 新建备忘</button>
    <span style="font-size:12px;color:#aaa;line-height:30px;margin-left:8px">
      回车换行创建下一条
    </span>
  </div>
  <div class="memo-list" id="memoList"></div>
</div>

<script>
// ── 数据层 ──
const STORAGE_KEY = 'memo_app_data';

// 数据结构: { id, name, parentId, children(folder only), memos: [{id,text,done,time}] }
let data = { folders:[], rootFolderIds:[] };  // folders 是扁平列表

function load() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) {
    try { data = JSON.parse(raw); } catch(e) { initDemo(); }
  } else { initDemo(); }
}
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

function uid() { return 'id_' + Date.now() + '_' + Math.random().toString(36).slice(2,7); }

function initDemo() {
  const f1 = uid(), f2 = uid(), f3 = uid();
  data = {
    folders: [
      { id:f1, name:'工作', parentId:null, },
      { id:f2, name:'个人', parentId:null, },
      { id:f3, name:'子项目', parentId:f1, },
    ],
    rootFolderIds: [f1, f2],
    memos: {
      [f1]: [{id:uid(),text:'完成季度报告',done:false,time:'2026-06-15'},
             {id:uid(),text:'回复客户邮件',done:true,time:'2026-06-14'}],
      [f2]: [{id:uid(),text:'买生日礼物',done:false,time:'2026-06-16'}],
      [f3]: [{id:uid(),text:'整理接口文档',done:false,time:'2026-06-13'}],
    }
  };
  save();
}

function getFolder(id) { return data.folders.find(f => f.id === id); }
function getChildren(parentId) {
  return data.folders.filter(f => f.parentId === parentId);
}
function getMemos(folderId) {
  if (!data.memos) data.memos = {};
  if (!data.memos[folderId]) data.memos[folderId] = [];
  return data.memos[folderId];
}
function getPath(folderId) {
  const parts = [];
  let cur = getFolder(folderId);
  while (cur) { parts.unshift(cur.name); cur = getFolder(cur.parentId); }
  return parts.join(' / ');
}
function countAllMemos(folderId) {
  let count = getMemos(folderId).length;
  getChildren(folderId).forEach(c => count += countAllMemos(c.id));
  return count;
}

// ── 全局状态 ──
let currentFolderId = null;
let ctxTarget = null; // 右键目标

// ── 渲染目录树 ──
function renderTree() {
  const tree = document.getElementById('tree');
  tree.innerHTML = data.rootFolderIds.map(id => renderFolderNode(id, 0)).join('');

  // 如果当前选中的文件夹已被删除，清除选中
  if (currentFolderId && !getFolder(currentFolderId)) {
    currentFolderId = null;
    renderMemoList();
  }
}

function renderFolderNode(id, depth) {
  const f = getFolder(id);
  if (!f) return '';
  const children = getChildren(id);
  const hasChildren = children.length > 0;
  const isOpen = f._open !== false; // 默认展开
  const isActive = currentFolderId === id;

  let html = `<div class="tree-item" data-id="${id}">`;
  html += `<div class="tree-row${isActive?' active':''}" style="padding-left:${12+depth*16}px"
            onclick="selectFolder('${id}')" oncontextmenu="showCtx(event,'${id}')">`;
  html += `<span class="arrow${isOpen&&hasChildren?' expanded':''}"
            onclick="event.stopPropagation();toggleFolder('${id}')">▶</span>`;
  html += `<span class="icon">${hasChildren?(isOpen?'📂':'📁'):'📁'}</span>`;
  html += `<span class="name">${escHtml(f.name)}</span>`;
  html += `<span class="badge">${countAllMemos(id) || ''}</span>`;
  html += `<span class="actions">`;
  html += `<button onclick="event.stopPropagation();startRename('${id}')" title="重命名">✏️</button>`;
  html += `<button onclick="event.stopPropagation();deleteFolder('${id}')" title="删除" style="color:#e55">✕</button>`;
  html += `</span></div>`;

  if (hasChildren) {
    html += `<div class="children${isOpen?' open':''}">`;
    children.forEach(c => html += renderFolderNode(c.id, depth+1));
    html += `</div>`;
  }
  html += `</div>`;
  return html;
}

function escHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// ── 渲染备忘录列表 ──
function renderMemoList() {
  const list = document.getElementById('memoList');
  const title = document.getElementById('currentTitle');
  const breadcrumb = document.getElementById('breadcrumb');
  const btn = document.getElementById('btnNewMemo');

  if (!currentFolderId || !getFolder(currentFolderId)) {
    title.textContent = '选择一个目录';
    breadcrumb.textContent = '';
    btn.style.display = 'none';
    list.innerHTML = `<div class="empty-state">
      <div class="empty-icon">📝</div><div>在左侧选择或新建一个目录开始记录</div></div>`;
    return;
  }

  btn.style.display = '';
  const f = getFolder(currentFolderId);
  title.textContent = f.name;
  breadcrumb.textContent = getPath(currentFolderId);

  const memos = getMemos(currentFolderId);
  if (memos.length === 0) {
    list.innerHTML = `<div class="empty-state">
      <div class="empty-icon">✨</div><div>还没有备忘，点击上方按钮新建</div></div>`;
  } else {
    list.innerHTML = memos.map((m,i) => `
      <div class="memo-item" data-index="${i}">
        <input type="checkbox" ${m.done?'checked':''} onchange="toggleMemo(${i})" title="标记完成/未完成">
        <input class="memo-text${m.done?' done':''}" value="${escHtml(m.text)}"
               onchange="updateMemoText(${i},this.value)" onkeydown="memoKeydown(event,${i})">
        <span class="memo-time">${m.time || ''}</span>
        <button class="memo-del" onclick="deleteMemo(${i})" title="删除">✕</button>
      </div>`).join('');
  }
}

function refresh() {
  renderTree();
  renderMemoList();
  save();
}

// ── 目录操作 ──
function selectFolder(id) {
  currentFolderId = id;
  renderTree();
  renderMemoList();
}

function toggleFolder(id) {
  const f = getFolder(id);
  if (f) { f._open = !(f._open !== false); refresh(); }
}

function addRootFolder() {
  const name = prompt('请输入目录名称：');
  if (!name || !name.trim()) return;
  const id = uid();
  data.folders.push({ id, name: name.trim(), parentId: null });
  data.rootFolderIds.push(id);
  currentFolderId = id;
  refresh();
}

function addSubFolder(parentId) {
  const name = prompt('请输入子目录名称：');
  if (!name || !name.trim()) return;
  const id = uid();
  data.folders.push({ id, name: name.trim(), parentId });
  // 确保父目录展开
  const parent = getFolder(parentId);
  if (parent) parent._open = true;
  currentFolderId = id;
  refresh();
}

function startRename(id) {
  const f = getFolder(id);
  if (!f) return;
  showModal('重命名目录', f.name, (newName) => {
    if (newName && newName.trim()) {
      f.name = newName.trim();
      refresh();
    }
  });
}

function deleteFolder(id) {
  const f = getFolder(id);
  if (!f) return;
  const total = countAllMemos(id) + 1; // +1 自身
  if (!confirm(`确定删除目录「${f.name}」及其所有子目录和 ${countAllMemos(id)} 条备忘吗？此操作不可撤销。`)) return;

  // 递归删除
  function delRec(fid) {
    getChildren(fid).forEach(c => delRec(c.id));
    delete data.memos[fid];
    data.folders = data.folders.filter(x => x.id !== fid);
  }
  delRec(id);
  data.rootFolderIds = data.rootFolderIds.filter(x => x !== id);
  if (currentFolderId === id) currentFolderId = null;
  refresh();
}

// ── 备忘操作 ──
function addMemo() {
  if (!currentFolderId) return;
  const memos = getMemos(currentFolderId);
  const now = new Date().toISOString().slice(0,10);
  memos.push({ id:uid(), text:'', done:false, time:now });
  refresh();
  // 自动聚焦到新创建的空备忘
  setTimeout(() => {
    const items = document.querySelectorAll('.memo-text');
    const last = items[items.length-1];
    if (last) last.focus();
  }, 50);
}

function toggleMemo(index) {
  const memos = getMemos(currentFolderId);
  if (memos[index]) {
    memos[index].done = !memos[index].done;
    save();
    renderMemoList();
  }
}

function updateMemoText(index, text) {
  const memos = getMemos(currentFolderId);
  if (memos[index]) {
    memos[index].text = text;
    save();
  }
}

function memoKeydown(event, index) {
  if (event.key === 'Enter') {
    event.preventDefault();
    const memos = getMemos(currentFolderId);
    // 如果当前备忘为空，删除它；否则新建一条
    if (memos[index] && memos[index].text.trim() === '') {
      memos.splice(index, 1);
    }
    addMemo();
  }
  if (event.key === 'Backspace' && event.target.value === '') {
    const memos = getMemos(currentFolderId);
    if (memos.length > 1) {
      event.preventDefault();
      memos.splice(index, 1);
      refresh();
      // 聚焦到上一条
      setTimeout(() => {
        const items = document.querySelectorAll('.memo-text');
        const prev = items[Math.min(index, items.length-1)];
        if (prev) prev.focus();
      }, 50);
    }
  }
}

function deleteMemo(index) {
  const memos = getMemos(currentFolderId);
  memos.splice(index, 1);
  refresh();
}

// ── 右键菜单 ──
function showCtx(e, folderId) {
  e.preventDefault();
  ctxTarget = folderId;
  const menu = document.getElementById('ctxMenu');
  menu.style.display = 'block';
  menu.style.left = e.clientX + 'px';
  menu.style.top = e.clientY + 'px';
}

document.getElementById('ctxMenu').addEventListener('click', function(e) {
  const action = e.target.dataset.action;
  if (!action || !ctxTarget) return;
  this.style.display = 'none';
  if (action === 'newFolder') addSubFolder(ctxTarget);
  if (action === 'rename') startRename(ctxTarget);
  if (action === 'delete') deleteFolder(ctxTarget);
  ctxTarget = null;
});

document.addEventListener('click', function(e) {
  if (!e.target.closest('.ctx-menu')) {
    document.getElementById('ctxMenu').style.display = 'none';
  }
});

// ── 弹窗 ──
function showModal(title, defaultValue, onConfirm) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal">
    <h4>${title}</h4>
    <input id="modalInput" value="${escHtml(defaultValue||'')}" autofocus>
    <div class="btns">
      <button class="btn btn-outline" id="modalCancel">取消</button>
      <button class="btn btn-primary" id="modalOk">确定</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);

  const input = overlay.querySelector('#modalInput');
  input.select();
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { onConfirm(input.value); overlay.remove(); }
    if (e.key === 'Escape') overlay.remove();
  });
  overlay.querySelector('#modalOk').onclick = () => { onConfirm(input.value); overlay.remove(); };
  overlay.querySelector('#modalCancel').onclick = () => overlay.remove();
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  input.focus();
}

// ── 初始化 ──
load();
if (data.rootFolderIds.length > 0) currentFolderId = data.rootFolderIds[0];
renderTree();
renderMemoList();
</script>
</body>
</html>
